services:
  web:
    build: .
    ports:
      - 4063:5000
    volumes:
      - .:/app
    environment:
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - OPENAI_API_BASE=${OPENAI_API_BASE}
      - OPENAI_MODEL=${OPENAI_MODEL}
      - DEBUG=1
    profiles:
      - dev

  web-prod:
    build: .
    ports:
      - 4063:5000
    volumes:
      - .:/app
    environment:
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - OPENAI_API_BASE=${OPENAI_API_BASE}
      - OPENAI_MODEL=${OPENAI_MODEL}
      - DEBUG=0
    restart: always
    profiles:
      - prod
